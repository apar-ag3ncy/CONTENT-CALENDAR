; PHP limits for the media-upload endpoint.
;
; WHY THIS FILE EXISTS, ALONGSIDE api/.htaccess:
; api/.htaccess sets the same values with `php_value`, but that directive ONLY
; works when PHP runs as an Apache module (mod_php). Most cPanel/GoDaddy hosts
; now run PHP-FPM or CGI, where `php_value` in .htaccess is silently ignored —
; so the server quietly fell back to the host default (often 2M) and every real
; photo upload failed. Under PHP-FPM/CGI, PHP reads this .user.ini instead.
;
; Between the two files the limits apply on either setup, with no cPanel access
; needed. Verify what actually took effect at:  /api/health  → "limits"
;
; Note: .user.ini is re-read every user_ini.cache_ttl seconds (default 300), so
; allow up to 5 minutes after deploying before the new values show up.

upload_max_filesize = 512M
post_max_size = 512M
memory_limit = 512M
max_execution_time = 600
max_input_time = 600
